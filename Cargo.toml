[workspace]
members = [".", "migration"]

[package]
name = "rust-dos-almanac"
version = "0.1.0"
edition = "2024"
description = "Game compatibility database and API for the Rust-DOS emulator"
license = "GPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8.22"
leptos_router = "0.8"
leptos_meta = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# hydrate
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# ssr
leptos_axum = { version = "0.8.10", optional = true }
axum = { version = "0.8", optional = true, features = ["macros"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = { version = "0.5", optional = true, features = ["util"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "compression-gzip"] }
sea-orm = { version = "2.0", optional = true, default-features = false, features = ["sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "macros", "with-json"] }
migration = { path = "migration", optional = true }
argon2 = { version = "0.5", optional = true }
governor = { version = "0.10", optional = true }
ipnet = { version = "2", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
clap = { version = "4", optional = true, features = ["derive", "env"] }
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
rpassword = { version = "7", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
  "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr",
  "dep:leptos_axum", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http",
  "dep:sea-orm", "dep:migration", "dep:argon2", "dep:governor", "dep:ipnet",
  "dep:hmac", "dep:sha2", "dep:rand", "dep:hex", "dep:clap", "dep:anyhow",
  "dep:thiserror", "dep:tracing", "dep:tracing-subscriber", "dep:rpassword",
]

[dev-dependencies]
http-body-util = "0.1"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "rust-dos-almanac"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
env = "DEV"

[[test]]
name = "api"
required-features = ["ssr"]
